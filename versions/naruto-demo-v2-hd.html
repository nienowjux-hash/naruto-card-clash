<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naruto Card Clash - Demo HD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07060f;color:#e9e6ff;font-family:'Trebuchet MS','Segoe UI',sans-serif;min-height:100vh}
#app{max-width:1180px;margin:0 auto;padding:14px 16px 28px}
h1{margin:4px 0 10px;font:900 italic 22px 'Arial Black',Impact,sans-serif;letter-spacing:2px;color:#ff9a2e;text-shadow:0 2px 0 #5a2200}
h1 small{font:600 12px 'Trebuchet MS',sans-serif;color:#8f8ab8;letter-spacing:1px;margin-left:10px;font-style:normal}
#stage{position:relative;width:100%;background:#000;border:3px solid #2a2350;border-radius:6px;overflow:hidden;box-shadow:0 0 40px #3a1d7a55}
canvas#c{display:block;width:100%;height:auto}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:10px;padding:12px 16px;pointer-events:none}
.pl{width:40%}.pl.r{text-align:right}
.pl b{font:900 italic clamp(11px,1.6vw,17px) 'Arial Black',sans-serif;letter-spacing:1px;text-shadow:0 2px 0 #000,0 0 8px #000}
.bar{position:relative;height:13px;background:#0b0b18;border:2px solid #000;border-radius:7px;margin-top:3px;box-shadow:0 0 0 1px #ffffff55;overflow:hidden;transform:skewX(-14deg)}
.bar.ck{height:7px}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .35s}
.bar i.ghost{background:#ffd23a;transition:width .9s .5s}
.hp i.v{background:linear-gradient(#a6ff8f,#2ea83a 60%,#1f7a2a)}
.ck i.v{background:linear-gradient(#a8e4ff,#2f7bff)}
.pl.r .bar i{left:auto;right:0}
.vs{font:900 italic 24px 'Arial Black',sans-serif;color:#ffd23a;text-shadow:0 2px 0 #000,0 0 12px #ff9a2e;align-self:center;padding-top:6px}
#banner{position:absolute;left:0;top:26%;width:100%;pointer-events:none;opacity:0;padding-left:5%}
#banner.on{animation:ban 1.7s cubic-bezier(.2,.9,.2,1) forwards}
#banner .jp{font:900 clamp(40px,9vw,112px)/1 'Yu Mincho','MS Mincho','Noto Serif JP',serif;color:#fff;text-shadow:0 0 14px var(--bc),0 0 34px var(--bc),4px 4px 0 #000;transform:skewX(-8deg);display:inline-block}
#banner .nm{font:900 italic clamp(16px,3vw,36px) 'Arial Black',Impact,sans-serif;letter-spacing:4px;color:var(--bc);text-shadow:0 3px 0 #000,0 0 12px var(--bc);margin-top:2px;padding-left:6px}
#banner .sb{font:700 clamp(10px,1.4vw,16px) 'Trebuchet MS',sans-serif;color:#cfd6ff;letter-spacing:3px;text-transform:uppercase;padding-left:8px;text-shadow:0 2px 0 #000}
@keyframes ban{0%{opacity:0;transform:translateX(-80px)}12%{opacity:1;transform:translateX(0)}78%{opacity:1;transform:translateX(18px)}100%{opacity:0;transform:translateX(70px)}}
#dmg{position:absolute;left:70%;top:34%;font:900 italic clamp(30px,6vw,80px) 'Arial Black',Impact,sans-serif;color:#fff35a;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 5px 0 #b02a00;opacity:0;pointer-events:none}
#dmg.on{animation:dm 1.3s ease-out forwards}
@keyframes dm{0%{opacity:0;transform:scale(2.4) translateY(10px)}12%{opacity:1;transform:scale(1) translateY(0)}70%{opacity:1;transform:translateY(-28px)}100%{opacity:0;transform:translateY(-48px)}}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#000c;border:1px solid #6a5fb0;padding:6px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#hand{display:flex;gap:14px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.card{position:relative;width:170px;background:linear-gradient(#2a2250,#14102c);border:2px solid #6a5fb0;border-radius:12px;padding:6px 6px 9px;cursor:pointer;transition:transform .15s,box-shadow .15s,filter .2s;user-select:none;color:inherit;font:inherit;text-align:left}
.card:hover:not(:disabled){transform:translateY(-12px) rotate(-1deg);box-shadow:0 10px 24px #000a,0 0 22px var(--cc);border-color:var(--cc)}
.card:disabled{filter:grayscale(.7) brightness(.55);cursor:wait}
.card canvas{width:100%;height:auto;display:block;border:2px solid #000;border-radius:6px;background:#000}
.card .cost{position:absolute;top:-9px;left:-9px;width:30px;height:30px;border-radius:50%;background:radial-gradient(#9fe0ff,#2f7bff);border:2px solid #fff;font:900 16px 'Arial Black',sans-serif;display:grid;place-items:center;color:#fff;text-shadow:0 1px 0 #000}
.card .key{position:absolute;top:-8px;right:-6px;background:#000;border:1px solid #6a5fb0;border-radius:4px;padding:1px 6px;font-size:11px;color:#aaa}
.card h3{margin:7px 0 2px;font:900 italic 14px 'Arial Black',sans-serif;color:var(--cc);letter-spacing:.5px;text-shadow:0 1px 0 #000}
.card p{margin:0;font-size:11.5px;line-height:1.3;color:#b9b4dc}
.card.locked{opacity:.8}
.ctl{display:flex;justify-content:center;gap:10px;margin-top:16px;font-size:13px}
.ctl button{background:#1a1536;color:#cfc9ff;border:1px solid #5a4fa0;border-radius:6px;padding:6px 14px;cursor:pointer;font:inherit}
.ctl button:hover{background:#2a2350}
.note{text-align:center;color:#7d78a8;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div id="app">
<h1>NARUTO CARD CLASH<small>DEMO DE COMBATE HD · FAN GAME</small></h1>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="pl"><b>SASUKE UCHIHA</b>
      <div class="bar hp"><i class="ghost" id="hpSg" style="width:100%"></i><i class="v" id="hpS" style="width:100%"></i></div>
      <div class="bar ck"><i class="v" id="ckS" style="width:100%"></i></div></div>
    <div class="vs">VS</div>
    <div class="pl r"><b>NARUTO UZUMAKI</b>
      <div class="bar hp"><i class="ghost" id="hpNg" style="width:100%"></i><i class="v" id="hpN" style="width:100%"></i></div>
      <div class="bar ck"><i class="v" id="ckN" style="width:100%"></i></div></div>
  </div>
  <div id="banner"><div class="jp"></div><div class="nm"></div><div class="sb"></div></div>
  <div id="dmg"></div>
  <div id="toast"></div>
</div>
<div id="hand"></div>
<div class="ctl"><button id="rst">Resetar luta</button><button id="mute">Som: ligado</button></div>
<div class="note">Escolha uma carta (ou tecle 1-2). Cartas 3 e 4 ainda não foram animadas nesta demo.</div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const W=384,H=216,K=1280/384,PW=1280,PH=720,GY=182;
const TAU=Math.PI*2;
const cv=$('c');cv.width=PW;cv.height=PH;
const g=cv.getContext('2d');
const fxc=document.createElement('canvas');fxc.width=PW;fxc.height=PH;const f=fxc.getContext('2d');
const hex=s=>{const n=parseInt(s.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const css=(c,k=1,a=1)=>`rgba(${Math.min(255,c[0]*k)|0},${Math.min(255,c[1]*k)|0},${Math.min(255,c[2]*k)|0},${a})`;
function R(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const OUT='#0a0a1e';
function setW(c,zoom,sx,sy){c.setTransform(K*zoom,0,0,K*zoom,PW/2+sx-W/2*K*zoom,PH/2+sy-H/2*K*zoom)}

/* ---------- drawing helpers (units; ctx already scaled) ---------- */
function orb(c,x,y,r,stops){const gr=c.createRadialGradient(x,y,0,x,y,r);for(const[s,col]of stops)gr.addColorStop(s,col);c.fillStyle=gr;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
function path(c,pts,close){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(close)c.closePath();}
function poly(c,pts,fill,stroke,lw,ox=0,oy=0){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0]+ox,p[1]+oy):c.moveTo(p[0]+ox,p[1]+oy));c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||.7;c.lineJoin='round';c.stroke();}}
function boltLines(x,y,ang,len,seed,branch){const rn=R(seed),lines=[];const pts=[[x,y]];let px=x,py=y,a=ang;const n=Math.max(3,Math.ceil(len/3));
 for(let i=0;i<n;i++){a+=(rn()-.5)*1.1;px+=Math.cos(a)*3;py+=Math.sin(a)*3;pts.push([px,py]);
  if(branch&&rn()<.2&&len>12)lines.push(...boltLines(px,py,a+(rn()<.5?1:-1)*(.6+rn()*.6),len*(1-i/n)*.55,seed*7+i,false));}
 lines.push(pts);return lines;}
function drawBolts(c,lines,s=1,cols){c.lineCap='round';c.lineJoin='round';
 const L=cols||[[3.4,'rgba(50,110,255,.30)'],[1.5,'rgba(120,215,255,.85)'],[.55,'#fff']];
 for(const[w,col]of L)for(const l of lines){c.strokeStyle=col;c.lineWidth=w*s;path(c,l);c.stroke();}}
function jagLines(x0,y0,x1,y1,seed,amp){const rn=R(seed),n=Math.max(3,Math.round(Math.hypot(x1-x0,y1-y0)/3));const p=[[x0,y0]];for(let i=1;i<n;i++){const k=i/n;p.push([x0+(x1-x0)*k+(rn()-.5)*amp,y0+(y1-y0)*k+(rn()-.5)*amp]);}p.push([x1,y1]);return[p];}
function blob(c,cx,cy,r,col,ph,amp=.22,sq=1){c.fillStyle=col;c.beginPath();const n=44;for(let i=0;i<=n;i++){const a=i/n*TAU;const rr=r*(1+amp*(Math.sin(a*5+ph)*.6+Math.sin(a*9-ph*1.7)*.4));const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*sq;i?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();c.fill();}
function fireBlob(c,x,y,r,ph){
 c.globalCompositeOperation='lighter';orb(c,x,y,r*2.4,[[0,'rgba(255,140,40,.55)'],[1,'rgba(255,60,0,0)']]);c.globalCompositeOperation='source-over';
 blob(c,x,y,r*1.02,'#5a0e0c',ph,.26);blob(c,x,y,r*.92,'#c42a16',ph+1,.26);blob(c,x,y,r*.74,'#ff6a1a',ph+2,.26);blob(c,x,y,r*.52,'#ffb02e',ph+3,.24);blob(c,x,y,r*.32,'#ffe680',ph+4,.2);blob(c,x,y,r*.16,'#fffbe8',ph+5,.15);}

/* ---------- characters ---------- */
function mkDef(o){for(const k in o)if(typeof o[k]==='string'&&o[k][0]==='#')o[k]=hex(o[k]);return o}
const SASUKE=mkDef({skin:'#f6d3b4',shirt:'#33449a',sleeve:'#33449a',fore:'#f6d3b4',collar:'#222f78',shorts:'#eceef8',shin:'#f6d3b4',wrap:'#f7f7f7',wrapLen:.5,shoe:'#1d2766',belt:'#5a4aa8',
 hair:'#1a2144',hairHi:'#5f7fd0',band:'#1f2d80',plate:'#d5dcec',iris:'#1a1a2e',style:'s'});
const NARUTO=mkDef({skin:'#fad0a4',shirt:'#f58f1c',sleeve:'#f58f1c',fore:'#f58f1c',collar:'#2a4fb8',shorts:'#f27f12',shin:'#f27f12',wrap:'#efece2',wrapLen:.22,shoe:'#1d2d78',belt:'#2a4fb8',
 hair:'#ffcf2e',hairHi:'#fff6a8',band:'#1f3fa0',plate:'#d5dcec',iris:'#2f7bff',style:'n'});
const IDLE={lean:0,crouch:0,fbx:-5,fby:0,ffx:5,ffy:0,hxF:4,hyF:12,hxB:-1,hyB:12,hdx:0,hdy:0,red:0,mouth:0};
const mk=o=>Object.assign({},IDLE,o);
function ik(sx,sy,hx,hy,l1,l2,dir){let dx=hx-sx,dy=hy-sy,d=Math.hypot(dx,dy);const mx=l1+l2-.05;if(d>mx){dx*=mx/d;dy*=mx/d;d=mx;hx=sx+dx;hy=sy+dy}if(d<.01)d=.01;
 const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));const px=sx+dx*a/d,py=sy+dy*a/d;return{ex:px+(-dy/d)*h*dir,ey:py+(dx/d)*h*dir,hx,hy}}
function rig(P){
 const S=[P.lean,-31+P.crouch],Hp=[P.lean*.35,-18+P.crouch];const hip=[Hp[0],Hp[1]+2];
 const lf=ik(hip[0]+1,hip[1],P.ffx,P.ffy,9,9,-1),lb=ik(hip[0]-1,hip[1],P.fbx,P.fby,9,9,-1);
 const sh=[S[0],S[1]+1];
 const hf=ik(sh[0],sh[1],sh[0]+P.hxF,sh[1]+P.hyF,8,8,1),hb=ik(sh[0],sh[1],sh[0]+P.hxB,sh[1]+P.hyB,8,8,1);
 const C=[S[0]+1+P.hdx,S[1]-9+P.hdy];
 return{S,Hp,hip,lf,lb,sh,hf,hb,C};
}
const SW=150,SH=112,OXU=75,OYU=94;
const sp=document.createElement('canvas');sp.width=Math.round(SW*K);sp.height=Math.round(SH*K);const sc=sp.getContext('2d');

function limb(c,pts,w,col,k,hi){c.lineCap='round';c.lineJoin='round';
 c.strokeStyle=OUT;c.lineWidth=w+1.25;path(c,pts);c.stroke();
 c.strokeStyle=css(col,k);c.lineWidth=w;path(c,pts);c.stroke();
 if(hi){c.save();c.translate(-w*.2,-w*.22);c.strokeStyle=css(mix(col,[255,255,255],.45),k,.5);c.lineWidth=w*.28;path(c,pts);c.stroke();c.restore();}}

function drawFig(c,d,P,time){
 const r=rig(P),S=r.S,Hp=r.Hp;
 function leg(hip,kk,k){const kn=[kk.ex,kk.ey],an=[kk.hx,kk.hy];
  limb(c,[hip,kn],5.0,d.shorts,k,true);
  limb(c,[kn,an],3.6,d.shin,k,true);
  const mid=[kn[0]+(an[0]-kn[0])*(1-d.wrapLen),kn[1]+(an[1]-kn[1])*(1-d.wrapLen)];
  limb(c,[mid,an],3.9,d.wrap,k,true);
  c.save();c.translate(an[0]+1.5,an[1]+.7);c.beginPath();c.ellipse(0,0,4,2,0,0,TAU);c.fillStyle=css(d.shoe,k);c.fill();c.strokeStyle=OUT;c.lineWidth=.7;c.stroke();
  c.fillStyle=css(mix(d.shoe,[255,255,255],.3),k,.6);c.beginPath();c.ellipse(.6,-.7,2.4,.6,0,0,TAU);c.fill();c.restore();}
 function arm(ka,k){const sh=r.sh,el=[ka.ex,ka.ey],ha=[ka.hx,ka.hy];
  limb(c,[sh,el],3.9,d.sleeve,k,true);
  limb(c,[el,ha],3.2,d.fore,k,true);
  if(d.style==='s'){const m=[el[0]+(ha[0]-el[0])*.38,el[1]+(ha[1]-el[1])*.38];limb(c,[m,ha],3.5,d.wrap,k,true);}
  else{const m=[el[0]+(ha[0]-el[0])*.75,el[1]+(ha[1]-el[1])*.75];limb(c,[m,ha],3.4,d.wrap,k,false);}
  c.beginPath();c.arc(ha[0],ha[1],1.9,0,TAU);c.fillStyle=css(d.skin,k);c.fill();c.strokeStyle=OUT;c.lineWidth=.7;c.stroke();
  c.fillStyle=css([255,255,255],1,.35*k);c.beginPath();c.arc(ha[0]-.5,ha[1]-.6,.7,0,TAU);c.fill();}
 const handsUp=P.hyB<-1;
 if(!handsUp)arm(r.hb,.76);
 leg(r.hip,r.lb,.76);
 // torso
 c.beginPath();c.moveTo(S[0]-5.4,S[1]+.8);c.quadraticCurveTo(S[0],S[1]-1.6,S[0]+5.4,S[1]+.8);c.quadraticCurveTo(Hp[0]+5.6,(S[1]+Hp[1])/2,Hp[0]+4.8,Hp[1]+2);c.lineTo(Hp[0]-4.8,Hp[1]+2);c.quadraticCurveTo(Hp[0]-5.6,(S[1]+Hp[1])/2,S[0]-5.4,S[1]+.8);c.closePath();
 let gr=c.createLinearGradient(S[0]-5,0,S[0]+6,0);gr.addColorStop(0,css(d.shirt,.62));gr.addColorStop(.55,css(d.shirt,1.05));gr.addColorStop(1,css(d.shirt,1.3));c.fillStyle=gr;c.fill();c.strokeStyle=OUT;c.lineWidth=.8;c.lineJoin='round';c.stroke();
 c.strokeStyle=css(d.shirt,.55,.8);c.lineWidth=.45;for(let i=0;i<3;i++){c.beginPath();c.moveTo(Hp[0]-3+i*2.8,Hp[1]-1.5);c.quadraticCurveTo(Hp[0]-2+i*2.8,Hp[1]-5,Hp[0]-3.6+i*2.8,Hp[1]-8);c.stroke();}
 // belt
 c.strokeStyle=OUT;c.lineWidth=2.6;c.beginPath();c.moveTo(Hp[0]-4.8,Hp[1]+1.4);c.lineTo(Hp[0]+4.8,Hp[1]+1.4);c.stroke();c.strokeStyle=css(d.belt,1);c.lineWidth=1.7;c.stroke();
 // shorts
 c.beginPath();c.moveTo(Hp[0]-4.9,Hp[1]+2.2);c.lineTo(Hp[0]+4.9,Hp[1]+2.2);c.lineTo(Hp[0]+6,Hp[1]+8.4);c.quadraticCurveTo(Hp[0],Hp[1]+10,Hp[0]-6,Hp[1]+8.4);c.closePath();
 gr=c.createLinearGradient(Hp[0]-6,0,Hp[0]+6,0);gr.addColorStop(0,css(d.shorts,.7));gr.addColorStop(1,css(d.shorts,1.05));c.fillStyle=gr;c.fill();c.strokeStyle=OUT;c.lineWidth=.7;c.stroke();
 // collar
 if(d.style==='s'){c.beginPath();c.moveTo(S[0]-5.4,S[1]+.9);c.lineTo(S[0]-4.6,S[1]-3.6);c.quadraticCurveTo(S[0]+.5,S[1]-5.2,S[0]+5,S[1]-3.4);c.lineTo(S[0]+5.4,S[1]+.9);c.quadraticCurveTo(S[0],S[1]-1.2,S[0]-5.4,S[1]+.9);c.closePath();c.fillStyle=css(d.collar,1);c.fill();c.strokeStyle=OUT;c.lineWidth=.7;c.stroke();
   c.strokeStyle=css(d.collar,1.9,.7);c.lineWidth=.4;c.beginPath();c.moveTo(S[0]-4,S[1]-2.6);c.quadraticCurveTo(S[0]+.5,S[1]-4,S[0]+4,S[1]-2.5);c.stroke();}
 else{c.beginPath();c.moveTo(S[0]-5.4,S[1]+.9);c.lineTo(S[0]-4.4,S[1]-2.6);c.quadraticCurveTo(S[0]+.5,S[1]-3.6,S[0]+4.6,S[1]-2.4);c.lineTo(S[0]+5.4,S[1]+.9);c.quadraticCurveTo(S[0],S[1]-.4,S[0]-5.4,S[1]+.9);c.closePath();c.fillStyle=css(d.collar,1);c.fill();c.strokeStyle=OUT;c.lineWidth=.7;c.stroke();
   c.strokeStyle=css(d.collar,1);c.lineWidth=1.1;c.beginPath();c.moveTo(S[0]+.8,S[1]+.6);c.lineTo(S[0]+1.4,Hp[1]+1);c.stroke();c.strokeStyle=OUT;c.lineWidth=.35;c.stroke();}
 leg(r.hip,r.lf,1);
 drawHead(c,d,P,r,time);
 if(handsUp)arm(r.hb,.76);
 arm(r.hf,1);
 return r;
}
function drawHead(c,d,P,r,time){
 const C=r.C,cx=C[0],cy=C[1];c.save();c.translate(cx,cy);
 const hg=c.createLinearGradient(-14,-14,8,8);hg.addColorStop(0,css(d.hair,1.6));hg.addColorStop(.5,css(d.hair,1));hg.addColorStop(1,css(d.hair,.65));
 const wv=Math.sin(time*5)*1.2;
 poly(c,[[-6.5,-3],[-12+wv*.3,-2.4+wv*.4],[-17+wv,1.6+wv],[-12.5+wv*.6,.4],[-14+wv,4.2+wv*.8],[-9,1.2],[-6.5,0]],css(d.band,1),OUT,.6);
 const back=d.style==='s'?[[-4,5],[-8,8.5],[-10,5.8],[-14.5,6.5],[-11.5,2.4],[-17,-1.5],[-10.5,-2],[-14.5,-7.5],[-7.5,-6.5],[-9.5,-12.5],[-3.5,-9.5],[-2.5,-14.5],[1.5,-10],[5,-13],[6.8,-7],[7.8,0]]
  :[[-5,5],[-9.5,8],[-11,3.8],[-15.5,3.4],[-12.5,-.6],[-17,-4],[-10.5,-4.5],[-13.5,-10],[-7,-8],[-8.5,-14.5],[-2.5,-10.5],[-2,-17],[2,-11.5],[5,-16.5],[6.8,-10.5],[11.5,-13],[9.2,-6.5],[13,-4],[8,-2.5],[7.8,2]];
 poly(c,back,hg,OUT,.8);

   const r2=R(fr*3);f.globalCompositeOperation='lighter';for(let i=0;i<14;i++){f.fillStyle=r2()<.5?'#ffd860':'#ff6a1a';f.fillRect(bx-br*.8-r2()*30,by+(r2()-.5)*br*1.5,.7+r2()*.5,.5);}f.globalCompositeOperation='source-over';}
  const a=t-2.4;
  if(a>=0&&a<1.4){explosionFX(f,tx+2,ty,a,fr);
   if(a>.15&&a<.95){const r2=R(fr*9),fa=a<.7?1:1-(a-.7)/.25;for(let i=0;i<8;i++){const fx=nx0+(i-3.5)*4+(r2()-.5)*4,fy=GY-4-((i*13+fr*3)%34)*fa*.9;blob(f,fx,fy,(3+r2()*3.4)*fa,'#ff7a1a',fr*.7+i,.35,1.4);blob(f,fx,fy-1,(1.8+r2()*2)*fa,'#ffd860',fr*.7+i,.3,1.4);}}
   if(a>.25){const fa=Math.min(1,(a-.25)/.3)*(1-Math.min(1,Math.max(0,(a-.9)/.5)));for(let i=0;i<6;i++)smoke(f,tx+(i-2.5)*8+Math.sin(a*3+i)*3,ty-16-(a-.25)*34-i*4,14+i*2,.55*fa);}
   f.globalCompositeOperation='lighter';
   if(a<.4){const k=a/.4,rr=4+72*(1-(1-k)*(1-k));ringFX(f,tx,ty,rr,2.4*(1-k)+.3,`rgba(255,220,120,${1-k})`);ringFX(f,tx,ty,rr*.85,1.4*(1-k)+.2,`rgba(255,120,30,${1-k})`);}
   const r2=R(55);for(let i=0;i<50;i++){const ang=r2()*TAU,spd=30+r2()*120;if(a>.9)continue;const x=tx+Math.cos(ang)*spd*a,y=ty+Math.sin(ang)*spd*a+80*a*a;f.fillStyle=r2()<.5?`rgba(255,216,96,${1-a/.9})`:`rgba(255,122,26,${1-a/.9})`;f.fillRect(x,y,.8,.8);}
   f.globalCompositeOperation='source-over';}
 }
 g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;g.drawImage(fxc,0,0);
 g.save();g.globalCompositeOperation='lighter';g.filter='blur(14px)';g.globalAlpha=.8;g.drawImage(fxc,0,0);g.filter='blur(4px)';g.globalAlpha=.4;g.drawImage(fxc,0,0);g.restore();
 if(flashA>0){g.fillStyle=`rgba(255,255,255,${flashA})`;g.fillRect(0,0,PW,PH);}
 const vg=g.createRadialGradient(PW/2,PH/2,PH*.35,PW/2,PH/2,PW*.62);vg.addColorStop(0,'rgba(0,0,12,0)');vg.addColorStop(1,'rgba(0,0,12,.55)');g.fillStyle=vg;g.fillRect(0,0,PW,PH);
 if(bars>0){const bh=bars*K;g.fillStyle='#000';g.fillRect(0,0,PW,bh);g.fillRect(0,PH-bh,PW,bh);}
}
function loop(ts){render(ts);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- cards ---------- */
function cardBG(c,a,b){const gr=c.createLinearGradient(0,0,0,80);gr.addColorStop(0,a);gr.addColorStop(1,b);c.fillStyle=gr;c.fillRect(0,0,64,80);}
const CARDS=[
 {id:'chidori',name:'Chidori',cost:3,col:'#7fd4ff',desc:'Sasuke concentra relâmpagos na mão e perfura o inimigo em alta velocidade.',live:true,
  icon:c=>{cardBG(c,'#050a30','#2a5bd0');c.globalCompositeOperation='lighter';orb(c,32,42,34,[[0,'rgba(120,190,255,.7)'],[1,'rgba(30,70,255,0)']]);let L=[];for(let i=0;i<16;i++){const r2=R(i*9+4);L.push(...boltLines(32,42,r2()*TAU,12+r2()*18,i*31+7,true));}drawBolts(c,L,.9);orb(c,32,42,10,[[0,'#fff'],[.4,'rgba(210,245,255,.9)'],[1,'rgba(90,170,255,0)']]);c.globalCompositeOperation='source-over';}},
 {id:'katon',name:'Katon: Bola de Fogo',cost:2,col:'#ffa43a',desc:'Uma enorme bola de fogo sai da boca e explode no alvo, causando queimadura.',live:true,
  icon:c=>{cardBG(c,'#2a0a14','#8a2a10');fireBlob(c,32,44,17,1.2);const r2=R(3);c.globalCompositeOperation='lighter';for(let i=0;i<16;i++){c.fillStyle=r2()<.5?'#ffd860':'#ff6a1a';c.fillRect(8+r2()*48,12+r2()*54,.7,.7);}c.globalCompositeOperation='source-over';}},
 {id:'kawarimi',name:'Kawarimi',cost:1,col:'#c9b27a',desc:'Substitui o corpo por um tronco e esquiva do próximo ataque.',live:false,
  icon:c=>{cardBG(c,'#16302e','#3d6a5a');const lg=c.createLinearGradient(0,28,0,58);lg.addColorStop(0,'#a06a36');lg.addColorStop(1,'#5a3414');c.fillStyle=lg;c.beginPath();c.roundRect(16,30,32,26,3);c.fill();c.strokeStyle='#2a1608';c.lineWidth=.8;c.stroke();c.fillStyle='#d9a96a';c.beginPath();c.ellipse(48,43,4,13,0,0,TAU);c.fill();c.stroke();c.strokeStyle='#7a4a24';c.beginPath();c.arc(48,43,2.2,0,TAU);c.stroke();[[14,30,9],[50,26,8],[24,18,8],[40,56,9],[14,52,7]].forEach(q=>orb(c,q[0],q[1],q[2],[[0,'rgba(255,255,255,.95)'],[.6,'rgba(235,240,245,.85)'],[1,'rgba(220,230,240,0)']]));}},
 {id:'amaterasu',name:'Amaterasu',cost:5,col:'#c75a8a',desc:'Chamas negras que não se apagam. Ultimate do Sharingan.',live:false,
  icon:c=>{cardBG(c,'#14041c','#3a0a3a');c.globalCompositeOperation='lighter';orb(c,32,40,30,[[0,'rgba(220,30,110,.4)'],[1,'rgba(220,30,110,0)']]);c.globalCompositeOperation='source-over';for(let i=0;i<5;i++)blob(c,32+(i-2)*6,54-i%2*4,12-Math.abs(i-2)*2,'#05020a',i*1.7,.35,1.5);for(let i=0;i<5;i++)blob(c,32+(i-2)*6,50-i%2*4,5,'#3a0a3e',i*2.3,.35,1.6);orb(c,32,24,10,[[0,'rgba(255,60,80,.8)'],[1,'rgba(255,60,80,0)']]);c.fillStyle='#e8d8d8';c.beginPath();c.arc(32,24,7,0,TAU);c.fill();c.fillStyle='#d81020';c.beginPath();c.arc(32,24,5,0,TAU);c.fill();c.fillStyle='#000';for(let i=0;i<3;i++){const a=i*TAU/3;c.beginPath();c.arc(32+Math.cos(a)*3,24+Math.sin(a)*3,1,0,TAU);c.fill();}c.beginPath();c.arc(32,24,1,0,TAU);c.fill();}}
];
function buildCards(){const h=$('hand');CARDS.forEach((cd,i)=>{const b=document.createElement('button');b.className='card'+(cd.live?'':' locked');b.style.setProperty('--cc',cd.col);
 b.innerHTML=`<span class="cost">${cd.cost}</span><span class="key">${i+1}</span><canvas width="256" height="320"></canvas><h3>${cd.name}</h3><p>${cd.desc}</p>`;
 const c=b.querySelector('canvas').getContext('2d');c.scale(4,4);cd.icon(c);b.onclick=()=>play(cd);cd.el=b;h.appendChild(b);});}
function setCards(on){CARDS.forEach(c=>c.el.disabled=!on)}
function play(cd){
 if(anim||frozen)return;
 if(!cd.live){toast(cd.name+': ainda não animada nesta demo');return;}
 ensureAudio();const A=ANIMS[cd.id];if(hp.n<=A.dmg)hp.n=100;
 anim={type:cd.id,t0:performance.now(),dur:A.dur};setCards(false);ck.s=Math.max(0,ck.s-A.cost);setBars();sfx(cd.id);
 if(cd.id==='chidori')later(1350,()=>banner('千鳥','CHIDORI','Mil Pássaros','#7fd4ff'));else later(1500,()=>banner('豪火球の術','KATON: GOUKAKYUU','Bola de Fogo Suprema','#ffa43a'));
 later(A.hitT*1000,()=>{hp.n=Math.max(0,hp.n-A.dmg);setBars();dmgPop(A.dmg);});
}
window.addEventListener('keydown',e=>{const n=parseInt(e.key,10);if(n>=1&&n<=CARDS.length)play(CARDS[n-1]);});
$('rst').onclick=()=>{pending.forEach(clearTimeout);pending=[];anim=null;hp={s:100,n:100};ck={s:100,n:100};setBars();setCards(true);$('banner').classList.remove('on');$('dmg').classList.remove('on');};
$('mute').onclick=()=>{sound=!sound;$('mute').textContent='Som: '+(sound?'ligado':'desligado');ensureAudio();};
buildCards();setBars();
window.debug={freeze:(type,t)=>{frozen=type?{type,t}:null},play:id=>play(CARDS.find(c=>c.id===id))};
setTimeout(()=>{if(!anim&&!frozen)play(CARDS[0]);},900);
</script>
