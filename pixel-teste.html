<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><title>Teste de pixel art</title>
<style>
body{margin:0;background:#0b0918;color:#e8e4ff;font-family:system-ui,sans-serif}
h1{font-size:18px;margin:14px 16px 4px}
p{margin:0 16px 10px;color:#a9a3c9;font-size:13px}
.row{display:flex;gap:14px;padding:8px 16px;flex-wrap:wrap}
.card{background:linear-gradient(#241d4a,#121030);border:1px solid #3a3270;border-radius:8px;padding:10px;text-align:center}
.card b{display:block;font-size:13px;margin-bottom:6px}
canvas{image-rendering:pixelated;display:block;margin:auto}
iframe{position:absolute;left:-3000px;width:1280px;height:720px;border:0}
</style></head><body>
<h1>Teste: Sasuke parado</h1>
<p>Esquerda: pixel art desenhada à mão. Meio: filtro pixel sobre o boneco atual. Direita: o boneco atual do jogo.</p>
<div class="row">
 <div class="card"><b>Pixel art à mão</b><canvas id="hand"></canvas></div>
 <div class="card"><b>Filtro pixel</b><canvas id="filt"></canvas></div>
 <div class="card"><b>Atual</b><canvas id="cur" width="230" height="330"></canvas></div>
</div>
<iframe id="game" src="naruto-demo.html"></iframe>
<script>
/* ---------- pixel art feita a mao ---------- */
const PAL={K:'#120a22',H:'#1a1f3d',h:'#2c3870',j:'#5468b0',S:'#f6d2b2',s:'#d9a58a',r:'#8c4650',W:'#f4f4fa',E:'#160c22',
 B:'#263070',M:'#cdd3e2',m:'#8f96b0',C:'#3346a0',c:'#222f76',D:'#4d61c4',P:'#eef0fa',p:'#b7bcd8',A:'#f4f4f6',a:'#c4c6d6',N:'#2a3a8c',n:'#141c4e',V:'#6a58b8'};
const GW=44,GH=60,G=Array.from({length:GH},()=>Array(GW).fill('.'));
const put=(x,y,str)=>{for(let i=0;i<str.length;i++){const ch=str[i];if(ch!=='.'&&x+i>=0&&x+i<GW&&y>=0&&y<GH)G[y][x+i]=ch;}};
const rows=(y0,list)=>list.forEach((r,i)=>{for(const [x,s] of r)put(x,y0+i,s);});
/* braco de tras (atras do tronco) */
rows(19,[[[8,'KK']],[[7,'KcCK']],[[6,'KcCCK']],[[6,'KcCCK']],[[6,'KsSSK']],[[6,'KsSSK']],[[6,'KsSK']],[[6,'KaAAK']],[[6,'KaAAK']],[[6,'KaAAK']],[[6,'KaAAK']],[[5,'KsSSSK']],[[5,'KsSSSK']],[[6,'KKKK']]]);
/* perna de tras: coxa para tras, joelho dobrado */
rows(40,[[[11,'KsSSK']],[[10,'KsSSK']],[[9,'KsSSK']],[[8,'KsSSK']],[[8,'KsSSK']],[[7,'KsSSSK']],[[7,'KsSSK']],[[7,'KaAAK']],[[7,'KaAAK']],[[8,'KaAAK']],[[8,'KaAAK']],[[8,'KaAAK']],[[8,'KaAAK']],[[8,'KaAAK']],[[7,'KnNNNK']],[[7,'KnNNNNNK']],[[7,'KnnnnnnnK']],[[7,'KKKKKKKKK']]]);
/* perna da frente: coxa avancada */
rows(40,[[[21,'KSSSK']],[[22,'KSSSK']],[[23,'KSSSK']],[[24,'KSSSK']],[[25,'KSSSK']],[[25,'KSSSSK']],[[25,'KsSSK']],[[25,'KAAaK']],[[25,'KAAaK']],[[25,'KAAaK']],[[25,'KAAaK']],[[25,'KAAaK']],[[25,'KAAaK']],[[25,'KAAaK']],[[25,'KNNNNK']],[[25,'KNNNNNNK']],[[25,'KnnnnnnnK']],[[25,'KKKKKKKKK']]]);
/* tronco, cinto e bermuda */
rows(18,[[[12,'KccccccccccccK']],[[11,'KcCCCCCCCCCCCcK']],[[10,'KcCCCCCCCCCCCCCK']],[[10,'KcCCCCCCCDCCCCCK']],
 [[10,'KcCCCCCCCDCCCCK']],[[10,'KccCCCCCCDCCCCK']],[[10,'KcCCCCCCCDCCCCK']],[[10,'KcCCCCCCCDCCCCK']],[[10,'KccCCCCCCDCCCCK']],[[10,'KcCCCCCCCDCCCCK']],
 [[11,'KcCCCCCCDCCCK']],[[11,'KcCCcCCCDCCCK']],[[11,'KcCCCcCCDCcCK']],[[11,'KccCCCcCDCCcK']],[[11,'KcCCCCCCCCCCK']],[[11,'KVVVVVVVVVVVK']],
 [[11,'KpPPPPPPPPPPPK']],[[10,'KpPPPPPPPPPPPPK']],[[10,'KpPPPPPPPPPPPPPK']],[[10,'KpPPPPPKpPPPPPPK']],[[10,'KpPPPK'],[18,'KpPPPPPPK']],[[10,'KpPPK'],[20,'KpPPPPPK']]]);
/* cabeca: cabelo espetado para tras, franja dos lados do rosto */
rows(0,[[[16,'K'],[21,'K']],[[5,'K'],[15,'KjK'],[20,'KhK']],[[5,'KhK'],[14,'KhhK'],[19,'KhhK'],[25,'K']],[[5,'KhhK'],[10,'K'],[13,'KhjhKKhhhK'],[24,'KhK']],
 [[5,'KhhhKhhKhhjhhhhhhhhhKhhK']],[[2,'KK'],[5,'KhhhhhhhhjhhhhhhhhhhhhK']],[[2,'KhhKHhhhhhhhjjhhhhhhhhhhhK']],[[3,'KhhHhhhhhjhhhhBBBBBBMMMMBK']],
 [[4,'KHhhhhhhhhhKBBBBBBMmmMBK']],[[4,'KHhhhhhhhhhhKhSKKSSSKKShK']],[[2,'KK'],[5,'KHhhhhhhhhhKhSSSSSSSSShK']],[[3,'KhK'],[5,'KHhhhhhhhhhKhSKKSSSKKShK']],
 [[4,'KhK'],[6,'KHhhhhhhhKhsWESSSWEsK']],[[5,'KHhhhhhhhhhKhsSSSSSSsK']],[[5,'KKhK'],[8,'KhhhhhhhKhssSSssSK']],[[6,'KK'],[9,'KHhhhhKKssSSSSK']],
 [[11,'KKKKKKssssKK']],[[13,'KcccKssssKccK']]]);
/* braco da frente com o punho erguido */
rows(18,[[[33,'KKK']],[[23,'KK'],[32,'KSSSK']],[[23,'KCCK'],[32,'KSSSSK']],[[23,'KcCCK'],[31,'KsSSSSK']],[[24,'KcCK'],[29,'KAA'],[32,'KsSSK']],
 [[24,'KsSK'],[28,'KAAaK']],[[24,'KsSK'],[27,'KAAaK']],[[24,'KsK'],[26,'KAAaK']],[[25,'KsSaK']],[[25,'KKKK']]]);
const hc=document.getElementById('hand'),HS=5;hc.width=GW*HS;hc.height=GH*HS;const hx=hc.getContext('2d');
for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const ch=G[y][x];if(ch==='.')continue;hx.fillStyle=PAL[ch]||'#f0f';hx.fillRect(x*HS,y*HS,HS,HS);}

/* ---------- boneco atual e filtro, desenhados com o codigo do jogo ---------- */
document.getElementById('game').onload=()=>{const cw=document.getElementById('game').contentWindow;
 const drawFig=cw.eval('drawFig'),SAS=cw.eval('SASUKE'),READY=cw.eval('READY');
 const cur=document.getElementById('cur').getContext('2d');cur.setTransform(4.3,0,0,4.3,105,322);drawFig(cur,SAS,READY,0);
 /* filtro: desenha pequeno, limpa o alfa, reduz a paleta e poe contorno de 1 pixel */
 const LW=44,LH=60,lc=document.createElement('canvas');lc.width=LW;lc.height=LH;const lx=lc.getContext('2d');
 lx.setTransform(.8,0,0,.8,20,58);drawFig(lx,SAS,READY,0);
 const id=lx.getImageData(0,0,LW,LH),d=id.data,q=v=>Math.round(v/51)*51;
 const solid=(x,y)=>x>=0&&y>=0&&x<LW&&y<LH&&d[(y*LW+x)*4+3]>110;
 const out=new Uint8ClampedArray(d.length);
 for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){const i=(y*LW+x)*4;
  if(solid(x,y)){out[i]=q(d[i]);out[i+1]=q(d[i+1]);out[i+2]=q(d[i+2]);out[i+3]=255;}
  else if(solid(x-1,y)||solid(x+1,y)||solid(x,y-1)||solid(x,y+1)){out[i]=18;out[i+1]=10;out[i+2]=34;out[i+3]=255;}}
 lx.putImageData(new ImageData(out,LW,LH),0,0);
 const fc=document.getElementById('filt');fc.width=LW*HS;fc.height=LH*HS;const fx=fc.getContext('2d');fx.imageSmoothingEnabled=false;fx.drawImage(lc,0,0,LW*HS,LH*HS);
};
</script></body></html>
