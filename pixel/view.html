<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><title>Sprites em pixel art</title>
<style>
body{margin:0;background:#0b0918;color:#e8e4ff;font-family:system-ui,sans-serif}
.row{display:flex;gap:16px;padding:12px 16px;align-items:flex-end;flex-wrap:wrap}
.card{background:linear-gradient(#2a2156,#121030);border:1px solid #3a3270;border-radius:8px;padding:10px;cursor:pointer}
.card.sel{border-color:#ffd25a}
.card b{display:block;font-size:12px;margin-bottom:6px;color:#bdb6e6}
canvas{image-rendering:pixelated;display:block}
</style></head><body>
<div class="row" id="all"></div>
<div class="row">
 <div class="card" id="bigcard"><b id="bigname">Ampliado (grade a cada 5 px)</b><canvas id="big"></canvas></div>
 <div class="card"><b>Tamanho do jogo (3x)</b><canvas id="game"></canvas></div>
 <div class="card"><b>Fundo claro (3x)</b><canvas id="light"></canvas></div>
</div>
<script src="pixgrid.js"></script><script src="sasuke.js"></script><script src="sasuke-guard.js"></script><script src="sasuke-poses.js"></script><script src="sasuke-idle.js"></script><script src="sasuke-run.js"></script><script src="sasuke-throw.js"></script><script src="sasuke-between.js"></script><script src="naruto.js"></script><script src="naruto-bent.js"></script><script src="naruto-fours.js"></script><script src="naruto-run.js"></script><script src="breath.js"></script><script src="gamabunta.js"></script><script src="sasuke-lv2.js"></script><script src="sakura.js"></script><script src="kakashi.js"></script><script src="ninken.js"></script>
<script>
/* ?s=idle|guard|punch|hit|down escolhe a pose ampliada; clicar numa miniatura tambem troca */
const POSES={nbent:['Naruto curvado (Sennen)',naruBent,NAR_PAL],bullb0:['Ninken bull bite0',()=>ninkenGrid('bull','bite',0),Object.assign({},NINKEN_PAL,NINKEN_KIND.bull)],bullb2:['Ninken bull bite2',()=>ninkenGrid('bull','bite',2),Object.assign({},NINKEN_PAL,NINKEN_KIND.bull)],bulll3:['Ninken bull leap3',()=>ninkenGrid('bull','leap',3),Object.assign({},NINKEN_PAL,NINKEN_KIND.bull)],pugb0:['Ninken pug bite0',()=>ninkenGrid('pug','bite',0),Object.assign({},NINKEN_PAL,NINKEN_KIND.pug)],pugb2:['Ninken pug bite2',()=>ninkenGrid('pug','bite',2),Object.assign({},NINKEN_PAL,NINKEN_KIND.pug)],pugl3:['Ninken pug leap3',()=>ninkenGrid('pug','leap',3),Object.assign({},NINKEN_PAL,NINKEN_KIND.pug)],shibab0:['Ninken shiba bite0',()=>ninkenGrid('shiba','bite',0),Object.assign({},NINKEN_PAL,NINKEN_KIND.shiba)],shibab2:['Ninken shiba bite2',()=>ninkenGrid('shiba','bite',2),Object.assign({},NINKEN_PAL,NINKEN_KIND.shiba)],shibal3:['Ninken shiba leap3',()=>ninkenGrid('shiba','leap',3),Object.assign({},NINKEN_PAL,NINKEN_KIND.shiba)],grayb0:['Ninken gray bite0',()=>ninkenGrid('gray','bite',0),Object.assign({},NINKEN_PAL,NINKEN_KIND.gray)],grayb2:['Ninken gray bite2',()=>ninkenGrid('gray','bite',2),Object.assign({},NINKEN_PAL,NINKEN_KIND.gray)],grayl3:['Ninken gray leap3',()=>ninkenGrid('gray','leap',3),Object.assign({},NINKEN_PAL,NINKEN_KIND.gray)],kag:['Kakashi base de luta',kakashiFrom(sasukeGuard),KAK_PAL],kap:['Kakashi soco',kakashiFrom(sasukePunch),KAK_PAL],kac:['Kakashi Raikiri',kakashiFrom(sasukeChidori),KAK_PAL],kad:['Kakashi caido',kakashiFrom(sasukeDown),KAK_PAL],skg:['Sakura base de luta',sakuraFrom(sasukeGuard),SAK_PAL],skp:['Sakura soco',sakuraFrom(sasukePunch),SAK_PAL],skh:['Sakura dano',sakuraFrom(sasukeHit),SAK_PAL],skd:['Sakura caida',sakuraFrom(sasukeDown),SAK_PAL],skk:['Sakura chute',sakuraFrom(sasukeKick),SAK_PAL],tw:['Arremesso (preparar)',sasukeThrowWind,SAS2_PAL],tt:['Arremesso (lancar)',sasukeThrow,SAS2_PAL],te:['Arremesso (terminar)',sasukeThrowEnd,SAS2_PAL],r0:['Corrida 1',sasukeRun0,SAS2_PAL],r1:['Corrida 2',sasukeRun1,SAS2_PAL],r2:['Corrida 3',sasukeRun2,SAS2_PAL],r3:['Corrida 4',sasukeRun3,SAS2_PAL],nr0:['Naruto corrida 1',naruRun0,NAR_PAL],nr1:['Naruto corrida 2',naruRun1,NAR_PAL],nr2:['Naruto corrida 3',naruRun2,NAR_PAL],nr3:['Naruto corrida 4',naruRun3,NAR_PAL],idle:['Parado',sasukeIdle,SAS2_PAL],guard:['Base de luta',sasukeGuard,SAS2_PAL],punch:['Soco',sasukePunch,SAS2_PAL],pw:['Soco (preparar)',sasukePunchWind,SAS2_PAL],eh:['Amaterasu (mao no olho)',sasukeEyeHand,SAS2_PAL],kw:['Chute (preparar)',sasukeKickWind,SAS2_PAL],npw:['Naruto soco (preparar)',naruPunchWind,NAR_PAL],nsx:['Oiroke no Jutsu',naruSexy,NAR_PAL],n4:['Naruto de quatro (Kyubi)',naruFours,NAR_PAL],n4c:['De quatro: agachar',naruFourCoil,NAR_PAL],n4a:['De quatro: galope A',naruFourRunA,NAR_PAL],n4b:['De quatro: galope B',naruFourRunB,NAR_PAL],n4l:['De quatro: bote',naruFourLunge,NAR_PAL],bunta:['Gama Bunta',gamaBunta,BUNTA_PAL],l2g:['Selo nível 2 (base)',lv2From(sasukeGuard),LV2_PAL],l2p:['Selo nível 2 (soco)',lv2From(sasukePunch),LV2_PAL],l2c:['Selo nível 2 (Chidori)',lv2From(sasukeChidori),LV2_PAL],l2h:['Selo nível 2 (dano)',lv2From(sasukeHit),LV2_PAL],hit:['Dano',sasukeHit,SAS2_PAL],down:['Caído (K.O.)',sasukeDown,SAS2_PAL],kick:['Chute',sasukeKick,SAS2_PAL],seal:['Selo de mãos (Tigre)',sasukeSeal,SAS2_PAL],chidori:['Chidori',sasukeChidori,SAS2_PAL],katon:['Katon',sasukeKaton,SAS2_PAL],log:['Kawarimi (tronco)',sasukeLog,SAS2_PAL],block:['Defesa',sasukeBlock,SAS2_PAL],ng:['Naruto: base',naruGuard,NAR_PAL],np:['Naruto: soco',naruPunch,NAR_PAL],nh:['Naruto: dano',naruHit,NAR_PAL],nd:['Naruto: caído',naruDown,NAR_PAL],nk:['Naruto: chute',naruKick,NAR_PAL],ns:['Naruto: selo',naruSeal,NAR_PAL],nb:['Naruto: defesa',naruBlock,NAR_PAL]};
const built={};for(const k in POSES)built[k]=POSES[k][1]();
function show(key){
 document.querySelectorAll('#all .card').forEach(c=>c.classList.toggle('sel',c.dataset.k===key));
 const g=built[key],PAL=POSES[key][2],S=8;document.getElementById('bigname').textContent=POSES[key][0]+' — ampliado (grade a cada 5 px)';
 const big=document.getElementById('big');g.draw(big,PAL,S);
 const c=big.getContext('2d');c.lineWidth=1;
 for(let x=0;x<=g.w;x++){c.beginPath();c.moveTo(x*S+.5,0);c.lineTo(x*S+.5,g.h*S);c.strokeStyle=x%5?'rgba(255,255,255,.05)':'rgba(255,220,120,.25)';c.stroke();}
 for(let y=0;y<=g.h;y++){c.beginPath();c.moveTo(0,y*S+.5);c.lineTo(g.w*S,y*S+.5);c.strokeStyle=y%5?'rgba(255,255,255,.05)':'rgba(255,220,120,.25)';c.stroke();}
 c.fillStyle='rgba(255,220,120,.7)';c.font='9px monospace';for(let x=0;x<g.w;x+=5)c.fillText(x,x*S+1,9);for(let y=5;y<g.h;y+=5)c.fillText(y,1,y*S-1);
 const tmp=document.createElement('canvas');g.draw(tmp,PAL,1);
 const gm=document.getElementById('game');gm.width=g.w*3+60;gm.height=g.h*3+20;const gx=gm.getContext('2d');
 const sky=gx.createLinearGradient(0,0,0,gm.height);sky.addColorStop(0,'#1c1640');sky.addColorStop(.75,'#2a2a6a');sky.addColorStop(.76,'#16235a');sky.addColorStop(1,'#0e1640');gx.fillStyle=sky;gx.fillRect(0,0,gm.width,gm.height);
 gx.imageSmoothingEnabled=false;gx.drawImage(tmp,30,10,g.w*3,g.h*3);
 const lc=document.getElementById('light');lc.width=g.w*3+20;lc.height=g.h*3+20;const lx=lc.getContext('2d');lx.fillStyle='#fff';lx.fillRect(0,0,lc.width,lc.height);lx.imageSmoothingEnabled=false;lx.drawImage(tmp,10,10,g.w*3,g.h*3);
 history.replaceState(null,'','?s='+key);}
const all=document.getElementById('all');
for(const k in POSES){const d=document.createElement('div');d.className='card';d.dataset.k=k;d.innerHTML='<b>'+POSES[k][0]+'</b>';const cv=document.createElement('canvas');built[k].draw(cv,POSES[k][2],3);d.appendChild(cv);d.onclick=()=>show(k);all.appendChild(d);}
const q=new URLSearchParams(location.search).get('s');show(POSES[q]?q:'guard');
</script></body></html>
